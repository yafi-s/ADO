name: Publish the drive console
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'results/behavior-v2/**'
      - 'assets/robotaxi/vehicle/meridian.glb'
      - 'assets/robotaxi/vehicle/meridian-studio.png'
      - 'assets/waymo-ipace/waymo-ipace.glb'
      - 'assets/waymo-ipace/studio.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'yafi-s/ADO'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Include the Blender design in the public viewer
        run: |
          mkdir -p web/vehicle-assets
          cp assets/robotaxi/vehicle/meridian.glb assets/robotaxi/vehicle/meridian-studio.png web/vehicle-assets/
          cp assets/waymo-ipace/waymo-ipace.glb web/vehicle-assets/
          cp assets/waymo-ipace/studio.png web/vehicle-assets/ipace-studio.png
      - name: Include the verified driving comparison
        if: ${{ hashFiles('results/behavior-v2/study.json') != '' }}
        run: cp -r results/behavior-v2 web/media/behavior-v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: publish
        uses: actions/deploy-pages@v4
