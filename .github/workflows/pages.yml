name: Publish the drive console
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/robotaxi/vehicle/meridian.glb'
      - 'assets/robotaxi/vehicle/meridian-studio.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'yafi-s/crosswalk-lab'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Include the Blender design in the public viewer
        run: |
          mkdir -p web/vehicle-assets
          cp assets/robotaxi/vehicle/meridian.glb assets/robotaxi/vehicle/meridian-studio.png web/vehicle-assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: publish
        uses: actions/deploy-pages@v4
