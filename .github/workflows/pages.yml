name: Publish the drive console
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'results/behavior-v2/**'
      - 'results/perception/rider-motion/*.mp4'
      - 'tools/prepare_pages_film.py'
      - 'assets/robotaxi/vehicle/meridian.glb'
      - 'assets/robotaxi/vehicle/meridian-studio.png'
      - 'assets/waymo-ipace/waymo-ipace.glb'
      - 'assets/waymo-ipace/studio.png'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish-from-main:
    # The Pages environment permits deployments from main. A release event runs on a tag.
    if: github.repository == 'yafi-s/ADO' && github.event_name == 'release' && github.event.release.tag_name == 'v0.3.0'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the release deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.repository == 'yafi-s/ADO' && github.event_name != 'release'
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - uses: actions/configure-pages@v5
      - name: Include the Blender design in the public viewer
        run: |
          mkdir -p web/vehicle-assets
          cp assets/robotaxi/vehicle/meridian.glb assets/robotaxi/vehicle/meridian-studio.png web/vehicle-assets/
          cp assets/waymo-ipace/waymo-ipace.glb web/vehicle-assets/
          cp assets/waymo-ipace/studio.png web/vehicle-assets/ipace-studio.png
      - name: Include the verified driving comparison
        if: ${{ hashFiles('results/behavior-v2/study.json') != '' }}
        run: cp -r results/behavior-v2 web/media/behavior-v2
      - name: Serve the full-quality city recording when published
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 tools/prepare_pages_film.py
      - name: Include the measured frame-by-frame comparison
        if: ${{ hashFiles('results/perception/rider-motion/high-occluded-pedestrian-and-van.mp4') != '' }}
        run: cp results/perception/rider-motion/high-occluded-pedestrian-and-van.mp4 web/media/frame-comparison.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Wait for this run's Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id') || id=""
            if [ -n "$id" ]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact still unavailable for run $GITHUB_RUN_ID" >&2
          exit 1
      - id: publish
        uses: actions/deploy-pages@v4
