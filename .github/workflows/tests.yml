name: Test the driving lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: choco install ffmpeg -y --no-progress
      - run: .\setup.ps1 -ClientOnly
      - name: Verify the town geometry for offline route tests
        shell: pwsh
        run: |
          $fixture = '.local/Town01_Opt-1.0.xodr'
          $source = 'https://raw.githubusercontent.com/BerkeleyLearnVerify/Scenic/979b09e10c2d119cd47f75115740b65f4f7e9999/assets/maps/CARLA/Town01.xodr'
          Invoke-WebRequest $source -OutFile $fixture
          if ((Get-FileHash $fixture).Hash -ne '97A7F6AC67812567E5C8EE0599CD823B23F80F30F3F97C502212E38B72E2B709') {
            throw 'The road network differs from the CARLA 1.0 AdditionalMaps release.'
          }
      - run: .\.venv-city\Scripts\python.exe -m unittest discover -s tests -v
        env:
          OPENBLAS_NUM_THREADS: '1'
