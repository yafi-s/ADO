name: Test the driving lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: choco install ffmpeg -y --no-progress
      - run: .\setup.ps1 -ClientOnly
      - run: .\.venv-city\Scripts\python.exe -m unittest discover -s tests -v
        env:
          OPENBLAS_NUM_THREADS: '1'
