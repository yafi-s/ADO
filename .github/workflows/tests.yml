name: Test the driving lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: choco install ffmpeg -y --no-progress
      - name: Cache the release-verified CARLA client
        uses: actions/cache@v4
        with:
          path: .local/carla-1.0-cp312-cp312-win_amd64.whl
          key: carla-win64-cp312-07b5d86f11e47636f3886358b5d32b47435f32d06cad00723ecad44035915a61
      - run: .\setup.ps1 -ClientOnly
      - name: Verify the town geometry for offline route tests
        shell: pwsh
        run: |
          $hashes = @{
            Town01 = '97A7F6AC67812567E5C8EE0599CD823B23F80F30F3F97C502212E38B72E2B709'
            Town03 = 'ABF177BCD9B66CFEFB7AC4919F6456815F1384F4229F1343C8A6A90BBB7713C9'
          }
          foreach ($town in $hashes.Keys) {
            $fixture = ".local/${town}_Opt-1.0.xodr"
            $source = "https://raw.githubusercontent.com/BerkeleyLearnVerify/Scenic/979b09e10c2d119cd47f75115740b65f4f7e9999/assets/maps/CARLA/${town}.xodr"
            Invoke-WebRequest $source -OutFile $fixture
            if ((Get-FileHash $fixture).Hash -ne $hashes[$town]) {
              throw "$town geometry differs from the CARLA 1.0 AdditionalMaps release."
            }
          }
      - run: .\.venv-city\Scripts\python.exe -m unittest discover -s tests -v
        env:
          OPENBLAS_NUM_THREADS: '1'
          CARLA_TOWN01_XODR: '.local/Town01_Opt-1.0.xodr'
          CARLA_TOWN03_XODR: '.local/Town03_Opt-1.0.xodr'
      - name: Verify replay transport and encounter seeking
        run: node --test tests/test_replay_pack.mjs tests/test_encounter_chapters.mjs
