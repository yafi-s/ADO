name: Test Waymo research code
on:
  push:
    paths:
      - 'waymo_training/**'
      - '.github/workflows/waymo-research.yml'
  pull_request:
    paths:
      - 'waymo_training/**'
      - '.github/workflows/waymo-research.yml'
permissions:
  contents: read
jobs:
  offline-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r waymo_training/requirements-colab.txt 'tensorflow-cpu==2.21.0' 'opencv-python-headless==4.13.0.92'
      - run: python -m unittest discover -s waymo_training/tests -v
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
